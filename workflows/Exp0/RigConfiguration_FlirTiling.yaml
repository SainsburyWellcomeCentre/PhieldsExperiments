# yaml-language-server: $schema=./Schemas/RigConfiguration.json
clockSynchronizer:
  deviceName: TimestampGeneratorGen3
  portName: COM9
cameraController:
  deviceName: CameraControllerGen2
  portName: COM7
  triggers:
    - TriggerName: Trigger0
      triggerFrequency: 20
    - TriggerName: Trigger1
      triggerFrequency: 125
cameras:
  - cameraName: Center
    triggerName: Trigger0
    exposureTime: 2000
    serialNumber: "25511624"
    gain: 0
    binning: 1
  - cameraName: West
    triggerName: Trigger0
    exposureTime: 1500
    serialNumber: "25511623"
    gain: 0
    binning: 1
  - cameraName: East
    triggerName: Trigger0
    exposureTime: 1500
    serialNumber: "25511622"
    gain: 0
    binning: 1
  - cameraName: North
    triggerName: Trigger0
    exposureTime: 1500
    serialNumber: "25511621"
    gain: 0
    binning: 1
  - cameraName: South
    triggerName: Trigger0
    exposureTime: 1500
    serialNumber: "25511620"
    gain: 0
    binning: 1
